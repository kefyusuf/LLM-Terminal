name: Ruff Import Diff

on:
  push:
    branches:
      - fix/download-poll-stale-status

permissions:
  contents: read

jobs:
  import-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Ruff
        run: python -m pip install "ruff==0.15.12"
      - name: Show Ruff import fix
        shell: bash
        run: |
          ruff check --select I001 --fix app/download_manager.py || true
          echo '--- Ruff-produced diff ---'
          git diff -- app/download_manager.py
